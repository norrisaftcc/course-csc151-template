name: Verify Java

# The workflow file keeps its old name so that existing branch protection
# rules keep matching it. What it runs has grown: it now compiles every
# example, runs the ones with a recorded expectation, and runs the JUnit
# tests. See scripts/verify.sh.

on:
  push:
    paths:
      - '**.java'
      - '**.expected'
      - '**.stdin'
      - 'scripts/**'
      - '.github/workflows/check-java.yml'
  pull_request:
    paths:
      - '**.java'
      - '**.expected'
      - '**.stdin'
      - 'scripts/**'
      - '.github/workflows/check-java.yml'

jobs:
  verify:
    name: Compile, run, and test Java examples
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The JUnit runner is not committed. It is downloaded once and cached,
      # keyed on the version recorded in scripts/fetch-junit.sh, so a version
      # change invalidates the cache automatically.
      - name: Restore cached JUnit runner
        id: junit-cache
        uses: actions/cache@v4
        with:
          path: .tools
          key: junit-${{ hashFiles('scripts/fetch-junit.sh') }}

      - name: Download JUnit runner
        if: steps.junit-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-junit.sh

      - name: Verify
        run: bash scripts/verify.sh all
