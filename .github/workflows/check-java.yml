name: Check Java Examples

on:
  push:
    paths:
      - '**.java'
      - 'scripts/check-java.sh'
      - '.github/workflows/check-java.yml'
  pull_request:
    paths:
      - '**.java'
      - 'scripts/check-java.sh'
      - '.github/workflows/check-java.yml'

jobs:
  compile:
    name: Compile all Java examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Java compile check
        run: bash scripts/check-java.sh
